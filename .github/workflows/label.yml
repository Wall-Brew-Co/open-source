name: Label Pull Requests
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:

    runs-on: ubuntu-latest

    steps:
    # https://github.com/actions/labeler
    - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
      with:
        repo-token: "${{ secrets.WALL_BREW_BOT_PAT }}"
