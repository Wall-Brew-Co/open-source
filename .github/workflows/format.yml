name: Formatter

on:
  pull_request: {}

permissions:
  contents: write

jobs:
  formatting:
    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/checkout
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.WALL_BREW_BOT_PAT }}

      # https://github.com/actions/setup-node
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Table of Contents Tool: https://github.com/thlorenz/doctoc
      - name: Update Markdown Files
        run: npm run doctoc

      # https://github.com/stefanzweifel/git-auto-commit-action
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: |
            [Format] Auto-formatting
